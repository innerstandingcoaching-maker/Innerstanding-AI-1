<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leads — Innerstanding</title>
<style>
  :root{
    --ink:#0d0b10; --ink-2:#17131c; --ink-3:#1f1826;
    --gold:#c6a15b; --gold-dim:rgba(198,161,91,0.35);
    --parchment:#ece5d8; --parchment-dim:rgba(236,229,216,0.65);
    --wine:#7a2e3a;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:32px 16px 60px;
    background:var(--ink); color:var(--parchment);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height:1.5;
    max-width:900px; margin-left:auto; margin-right:auto;
  }
  h1{
    font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    color:var(--gold); font-size:1.5rem; margin-bottom:4px;
  }
  .subtitle{ color:var(--parchment-dim); font-size:0.85rem; margin-bottom:24px; }
  .back{ display:inline-block; margin-bottom:20px; color:var(--gold); text-decoration:none; font-size:0.9rem; }

  .key-bar{
    display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;
  }
  .key-input{
    flex:1; min-width:200px;
    font-family:inherit; font-size:0.9rem; color:var(--parchment);
    background:var(--ink-2); border:1px solid var(--gold-dim);
    border-radius:10px; padding:10px 12px; outline:none;
  }
  .key-input:focus{ border-color:var(--gold); }
  .btn{
    font-family:inherit; font-weight:600; font-size:0.88rem;
    background:var(--gold); color:var(--ink);
    border:none; border-radius:10px;
    padding:10px 18px; cursor:pointer;
  }
  .btn:hover{ opacity:0.9; }
  .btn-secondary{
    background:transparent; color:var(--gold); border:1px solid var(--gold-dim);
  }

  .status{ font-size:0.85rem; color:var(--parchment-dim); margin-bottom:16px; min-height:1.2em; }
  .status.error{ color:#e3a1a1; }

  table{
    width:100%; border-collapse:collapse;
    background:var(--ink-2); border-radius:12px; overflow:hidden;
  }
  th, td{
    text-align:left; padding:12px 14px; font-size:0.88rem;
    border-bottom:1px solid rgba(198,161,91,0.15);
  }
  th{
    color:var(--gold); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.04em;
    background:var(--ink-3);
  }
  td{ color:var(--parchment-dim); }
  tr:last-child td{ border-bottom:none; }
  .empty{ text-align:center; padding:40px 20px; color:var(--parchment-dim); font-size:0.9rem; }
  .toolbar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px; flex-wrap:wrap; gap:10px;
  }
  .count{ color:var(--parchment-dim); font-size:0.85rem; }
</style>
</head>
<body>

<a href="/" class="back">← Volver a Innerstanding</a>
<h1>Leads capturados</h1>
<div class="subtitle">Emails de personas que probaron la app gratis.</div>

<div class="key-bar">
  <input type="password" class="key-input" id="keyInput" placeholder="Tu ADMIN_EXPORT_KEY">
  <button class="btn" id="loadBtn">Cargar leads</button>
</div>

<div class="status" id="status"></div>

<div class="toolbar" id="toolbar" style="display:none;">
  <div class="count" id="countText"></div>
  <button class="btn btn-secondary" id="downloadBtn">⬇ Descargar CSV</button>
</div>

<div id="tableWrap"></div>

<script>
const KEY_STORAGE = 'innerstanding_admin_key';
let currentLeads = [];

const keyInput = document.getElementById('keyInput');
const loadBtn = document.getElementById('loadBtn');
const statusEl = document.getElementById('status');
const toolbar = document.getElementById('toolbar');
const countText = document.getElementById('countText');
const tableWrap = document.getElementById('tableWrap');
const downloadBtn = document.getElementById('downloadBtn');

// Recuerda la clave en este navegador para no tener que escribirla cada vez.
try{
  const savedKey = localStorage.getItem(KEY_STORAGE);
  if (savedKey) keyInput.value = savedKey;
}catch(e){}

function parseLead(raw){
  const parts = raw.split('|').map(p => p.trim());
  const email = parts[0] || '';
  const deviceId = parts[1] || '';
  const dateRaw = parts[2] || '';
  let dateFormatted = dateRaw;
  const d = new Date(dateRaw);
  if (!isNaN(d.getTime())){
    dateFormatted = d.toLocaleString('es', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  return { email, deviceId, date: dateFormatted, rawDate: dateRaw };
}

function renderTable(leads){
  if (!leads.length){
    tableWrap.innerHTML = '<div class="empty">Todavía no hay ningún lead guardado.</div>';
    toolbar.style.display = 'none';
    return;
  }
  const rows = leads.map(l => `
    <tr>
      <td>${l.email}</td>
      <td>${l.date}</td>
    </tr>
  `).join('');
  tableWrap.innerHTML = `
    <table>
      <thead><tr><th>Email</th><th>Fecha</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  toolbar.style.display = 'flex';
  countText.textContent = `${leads.length} lead${leads.length === 1 ? '' : 's'}`;
}

async function loadLeads(){
  const key = keyInput.value.trim();
  if (!key){
    statusEl.textContent = 'Escribe tu clave primero.';
    statusEl.className = 'status error';
    return;
  }
  try{ localStorage.setItem(KEY_STORAGE, key); }catch(e){}

  statusEl.textContent = 'Cargando...';
  statusEl.className = 'status';
  loadBtn.disabled = true;

  try{
    const resp = await fetch('/api/leads-export?key=' + encodeURIComponent(key));
    const data = await resp.json();

    if (!resp.ok){
      statusEl.textContent = data.error || 'No se pudo cargar. Revisa tu clave.';
      statusEl.className = 'status error';
      tableWrap.innerHTML = '';
      toolbar.style.display = 'none';
      loadBtn.disabled = false;
      return;
    }

    currentLeads = (data.leads || []).map(parseLead);
    statusEl.textContent = '';
    renderTable(currentLeads);
  }catch(e){
    statusEl.textContent = 'Algo falló cargando los leads. Intenta de nuevo.';
    statusEl.className = 'status error';
  }
  loadBtn.disabled = false;
}

function downloadCSV(){
  if (!currentLeads.length) return;
  const header = 'Email,Fecha\n';
  const rows = currentLeads.map(l => `"${l.email}","${l.rawDate}"`).join('\n');
  const csv = header + rows;
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'innerstanding-leads-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

loadBtn.addEventListener('click', loadLeads);
keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadLeads(); });
downloadBtn.addEventListener('click', downloadCSV);

// Si ya había una clave guardada, carga automático.
if (keyInput.value) loadLeads();
</script>

</body>
</html>
