<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innerstanding · Habla con las cartas</title>
<style>
  :root{
    --ink:#12121a;
    --ink-2:#1b1b26;
    --ink-3:#22222f;
    --parchment:#ece5d8;
    --parchment-dim:#c9c0ae;
    --gold:#c6a15b;
    --gold-dim:#8d7643;
    --wine:#5e2436;
    --wine-light:#8a3c52;
    --line: rgba(198,161,91,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 700px 500px at 50% -10%, rgba(198,161,91,0.14), transparent 60%),
      var(--ink);
    color:var(--parchment);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow-x:hidden;
  }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    padding:28px 20px 18px;
    text-align:center;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .glow{
    position:absolute; top:-60px; left:50%; transform:translateX(-50%);
    width:280px; height:180px;
    background:radial-gradient(ellipse, rgba(198,161,91,0.35), transparent 70%);
    filter:blur(10px);
    pointer-events:none;
    animation:breathe 6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:0.55; transform:translateX(-50%) scale(1);}
    50%{opacity:1; transform:translateX(-50%) scale(1.08);}
  }
  .logo{
    width:64px; height:64px; border-radius:50%;
    object-fit:cover; margin-bottom:10px; z-index:1;
    box-shadow:0 0 0 1px var(--line), 0 6px 20px rgba(198,161,91,0.25);
  }
  .eyebrow{
    font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px; z-index:1;
  }
  .brand{
    font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif; font-size:1.4rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--parchment); z-index:1;
  }
  .brand span{ color:var(--gold); }
  .tagline{
    font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif; font-style:italic; font-weight:400;
    color:var(--parchment-dim); font-size:0.95rem; margin-top:8px; z-index:1;
    max-width:420px;
  }
  .voice-toggle{
    display:flex; align-items:center; gap:6px;
    margin-top:14px; z-index:1;
    font-size:0.78rem; color:var(--parchment-dim);
    cursor:pointer; user-select:none;
  }
  .voice-toggle input{ accent-color: var(--gold); width:15px; height:15px; cursor:pointer; }
  .content-mode-btn{
    margin-top:12px; z-index:1;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size:0.78rem; font-weight:600;
    background:transparent; color:var(--gold);
    border:1px solid var(--gold-dim);
    padding:8px 16px; border-radius:100px;
    cursor:pointer; transition:all 0.2s ease;
  }
  .content-mode-btn:hover{ background:rgba(198,161,91,0.1); border-color:var(--gold); }
  .content-mode-btn:disabled{ opacity:0.4; cursor:default; }
  .copy-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:transparent; border:1px solid var(--gold-dim);
    color:var(--gold); font-size:0.8rem;
    cursor:pointer; margin-top:8px; margin-left:6px;
    transition:all 0.2s ease;
  }
  .copy-btn:hover{ background:rgba(198,161,91,0.12); border-color:var(--gold); }
  .copy-btn.copied{ background:var(--gold); color:var(--ink); }
  .speak-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:50%;
    background:transparent; border:1px solid var(--gold-dim);
    color:var(--gold); font-size:0.85rem;
    cursor:pointer; margin-top:8px;
    transition:all 0.2s ease;
  }
  .speak-btn:hover{ background:rgba(198,161,91,0.12); border-color:var(--gold); }
  .speak-btn.speaking{ background:var(--gold); color:var(--ink); }

  /* ---------- Chat area ---------- */
  main{
    flex:1;
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:24px 16px 140px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .msg{
    max-width:86%;
    padding:14px 16px;
    border-radius:14px;
    line-height:1.55;
    font-size:0.96rem;
    white-space:pre-wrap;
    animation:rise 0.35s ease both;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg.ai{
    align-self:flex-start;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-top-left-radius:4px;
    color:var(--parchment);
  }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(155deg, var(--wine), var(--wine-light));
    border-top-right-radius:4px;
    color:var(--parchment);
  }
  .msg.ai b, .msg.ai strong{ color:var(--gold); }
  .chat-link{
    color:var(--gold);
    text-decoration:underline;
    word-break:break-word;
  }
  .chat-link-cta{
    display:inline-block;
    margin-top:10px;
    padding:10px 18px;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
    text-decoration:none;
    border-radius:100px;
    font-size:0.9rem;
  }

  .msg-label{
    font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif; font-style:italic;
    font-size:0.7rem; letter-spacing:0.04em;
    color:var(--gold-dim); margin-bottom:4px; display:block;
  }
  .msg.user .msg-label{ color:rgba(236,229,216,0.65); text-align:right; }

  .retry-btn{
    margin-top:10px;
    font-family:inherit; font-weight:600; font-size:0.82rem;
    background:transparent; color:var(--gold);
    border:1px solid var(--gold-dim);
    padding:7px 16px; border-radius:100px;
    cursor:pointer; transition:all 0.2s ease;
  }
  .retry-btn:hover{ background:rgba(198,161,91,0.1); border-color:var(--gold); }

  .typing{
    align-self:flex-start;
    display:flex; gap:5px; padding:14px 16px;
    background:var(--ink-2); border:1px solid var(--line);
    border-radius:14px; border-top-left-radius:4px;
  }
  .typing span{
    width:6px; height:6px; border-radius:50%; background:var(--gold-dim);
    animation:blink 1.2s infinite;
  }
  .typing span:nth-child(2){ animation-delay:0.2s; }
  .typing span:nth-child(3){ animation-delay:0.4s; }
  @keyframes blink{ 0%,80%,100%{opacity:0.25;} 40%{opacity:1;} }

  /* ---------- Card draw ---------- */
  .card-draw{
    align-self:center;
    display:flex; flex-direction:column; align-items:center;
    gap:10px;
    margin:8px 0 4px;
  }
  .tarot-card{
    width:150px; height:250px;
    border-radius:10px;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(198,161,91,0.25), transparent 65%),
      linear-gradient(160deg, var(--ink-3), var(--ink));
    border:1px solid var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
    cursor:pointer;
    transition:transform 0.4s ease;
    position:relative;
    overflow:hidden;
  }
  .tarot-card:hover{ transform:translateY(-3px); }
  .tarot-card::before{
    content:'✦';
    color:var(--gold);
    font-size:1.6rem;
  }
  .tarot-card.revealed{
    background:var(--ink);
    border-color:var(--gold);
    cursor:default;
    animation:flip 0.5s ease;
  }
  @keyframes flip{
    0%{ transform:rotateY(90deg); }
    100%{ transform:rotateY(0deg); }
  }
  .tarot-card.revealed::before{ display:none; }
  .tarot-card img{
    width:100%; height:100%; object-fit:cover; border-radius:9px;
  }
  .card-name{
    font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif; font-style:italic;
    text-align:center; font-size:0.95rem; color:var(--gold);
    padding:0 10px; margin-top:2px;
  }
  .draw-btn{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight:600; font-size:0.82rem;
    letter-spacing:0.03em;
    background:transparent; color:var(--gold);
    border:1px solid var(--gold-dim);
    padding:9px 18px; border-radius:100px;
    cursor:pointer;
    transition:all 0.2s ease;
  }
  .draw-btn:hover{ background:rgba(198,161,91,0.1); border-color:var(--gold); }
  .draw-btn:disabled{ opacity:0.35; cursor:default; }

  /* ---------- Input bar ---------- */
  .input-bar{
    position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(180deg, transparent, var(--ink) 30%);
    padding:20px 16px 22px;
  }
  .input-wrap{
    max-width:640px; margin:0 auto;
    display:flex; align-items:flex-end; gap:10px;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:18px;
    padding:8px 8px 8px 10px;
  }
  .card-btn{
    width:40px; height:40px; border-radius:50%; flex-shrink:0;
    background:transparent; border:1px solid var(--gold-dim);
    color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.2s ease;
  }
  .card-btn svg{ width:18px; height:18px; }
  .card-btn:hover{ background:rgba(198,161,91,0.12); border-color:var(--gold); }
  .card-btn:disabled{ opacity:0.3; cursor:default; }
  #cardsCounter.limit-note{ color:var(--gold-dim); }
  textarea{
    flex:1;
    background:transparent; border:none; outline:none;
    color:var(--parchment);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size:0.96rem;
    resize:none; max-height:120px; line-height:1.4;
    padding:8px 0;
  }
  textarea::placeholder{ color:var(--parchment-dim); }
  .send-btn{
    width:40px; height:40px; border-radius:50%;
    background:var(--gold); border:none; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform 0.15s ease, opacity 0.15s ease;
  }
  .send-btn:hover{ transform:scale(1.06); }
  .send-btn:disabled{ opacity:0.35; cursor:default; transform:none; }
  .send-btn svg{ width:17px; height:17px; }

  .disclaimer{
    text-align:center; font-size:0.68rem; color:var(--parchment-dim);
    max-width:640px; margin:2px auto 0; padding:0 20px;
  }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--gold-dim); border-radius:10px; }

  .video-mode-btn{
    margin-top:10px;
    font-family:inherit; font-weight:600; font-size:0.85rem;
    background:transparent; color:var(--gold);
    border:1px solid var(--gold-dim);
    padding:8px 16px; border-radius:100px;
    cursor:pointer; transition:all 0.2s ease;
  }
  .video-mode-btn:hover{ background:rgba(198,161,91,0.1); border-color:var(--gold); }

  .video-overlay{
    position:fixed; inset:0; z-index:999;
    background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
  }
  .video-close-btn{
    position:absolute; top:20px; right:20px; z-index:2;
    width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    color:#fff; font-size:1rem;
    cursor:pointer;
  }
  .video-stage{
    position:relative;
    width:100%; max-width:420px; aspect-ratio:9/16;
    border-radius:14px; overflow:hidden;
    background:#000;
  }
  .video-card-img{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    animation:kenburns 14s ease-in-out infinite alternate;
  }
  @keyframes kenburns{
    0%{ transform:scale(1) translate(0,0); }
    100%{ transform:scale(1.18) translate(-2%, -2%); }
  }
  .video-gradient{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, transparent 25%, transparent 55%, rgba(0,0,0,0.85) 100%);
  }
  .video-brand{
    position:absolute; top:18px; left:0; right:0;
    text-align:center;
    color:var(--gold);
    font-size:0.72rem; letter-spacing:0.2em; font-weight:700;
  }
  .video-caption{
    position:absolute; left:20px; right:20px; bottom:36px;
    color:#fff;
    font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    font-size:1.35rem; line-height:1.4; font-style:italic;
    text-shadow:0 2px 12px rgba(0,0,0,0.8);
    opacity:0;
  }
  .video-caption.caption-in{
    animation:captionIn 0.4s ease forwards;
  }
  @keyframes captionIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .video-hint{
    margin-top:16px; color:var(--parchment-dim);
    font-size:0.8rem; text-align:center; max-width:340px;
  }
  #videoPlayBtn{ margin-top:14px; }
</style>
</head>

let chat, input, sendBtn, autoVoiceToggle, cardBtn, cardsCounter, contentModeBtn;
let history = [];
let cardsDrawnCount = 0;
const MAX_CARDS = 3;
let spanishVoice = null;

function pickSpanishVoice(){
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  const isSpanish = v => /^es/i.test(v.lang);
  const isLatam = v => /es-VE|es-419|es-MX|es-US|es-CO|es-AR/i.test(v.lang);
  const isEnhanced = v => /enhanced|premium|neural|natural/i.test(v.name);
  // Nombres de voces de calidad "Enhanced" conocidas en iOS/macOS en español
  const knownGoodNames = /mónica|monica|paulina|juan carlos|jorge|angelica|angélica/i;

  spanishVoice =
    voices.find(v => isSpanish(v) && isLatam(v) && isEnhanced(v)) ||
    voices.find(v => isSpanish(v) && isEnhanced(v)) ||
    voices.find(v => isSpanish(v) && knownGoodNames.test(v.name)) ||
    voices.find(v => isSpanish(v) && isLatam(v)) ||
    voices.find(v => isSpanish(v)) ||
    null;
}
if ('speechSynthesis' in window){
  pickSpanishVoice();
  window.speechSynthesis.onvoiceschanged = pickSpanishVoice;
}

function closeVideoMode(){
  window.speechSynthesis.cancel();
  const overlay = document.getElementById('videoModeOverlay');
  if (overlay) overlay.remove();
}

function openVideoMode(card, text){
  window.speechSynthesis.cancel();

  const overlay = document.createElement('div');
  overlay.id = 'videoModeOverlay';
  overlay.className = 'video-overlay';
  overlay.innerHTML = `
    <button class="video-close-btn" id="videoCloseBtn" aria-label="Cerrar">✕</button>
    <div class="video-stage">
      <img src="/cards/${card.file}" alt="${card.name}" class="video-card-img">
      <div class="video-gradient"></div>
      <div class="video-brand">INNERSTANDING</div>
      <div class="video-caption" id="videoCaption"></div>
    </div>
    <p class="video-hint">Activa "Grabar pantalla" en tu iPhone y luego dale a reproducir 🔴</p>
    <button class="draw-btn" id="videoPlayBtn">▶ Reproducir</button>
  `;
  document.body.appendChild(overlay);

  document.getElementById('videoCloseBtn').addEventListener('click', closeVideoMode);

  const captionEl = document.getElementById('videoCaption');
  const playBtn = document.getElementById('videoPlayBtn');

  const cleanText = stripEmojis(text);
  const sentences = splitIntoSentences(cleanText);

  playBtn.addEventListener('click', () => {
    playBtn.remove();
    window.speechSynthesis.cancel();

    sentences.forEach((sentence) => {
      const utter = new SpeechSynthesisUtterance(sentence);
      if (spanishVoice) utter.voice = spanishVoice;
      utter.lang = spanishVoice ? spanishVoice.lang : 'es-ES';

      const vp = getVoiceParams(sentence);
      utter.rate = vp.rate;
      utter.pitch = vp.pitch;

      utter.onstart = () => {
        captionEl.classList.remove('caption-in');
        void captionEl.offsetWidth;
        captionEl.textContent = sentence;
        captionEl.classList.add('caption-in');
      };

      window.speechSynthesis.speak(utter);
    });
  });
}

function getVoiceParams(sentence){
  const isQuestion = /\?$/.test(sentence);
  const isExclamation = /!$/.test(sentence);
  const wiggle = (Math.random() * 0.08) - 0.04; // variación sutil para que no suene plano
  if (isExclamation) return { rate: 1.06, pitch: 1.24 + wiggle };
  if (isQuestion) return { rate: 0.99, pitch: 1.17 + wiggle };
  return { rate: 0.99, pitch: 1.08 + wiggle };
}

function stripEmojis(text){
  return text
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, '')
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}

function splitIntoSentences(text){
  const matches = text.match(/[^.!?¡¿]*[.!?]+["'»]?|\S+$/g);
  return matches ? matches.map(s => s.trim()).filter(Boolean) : [text];
}

function speak(text, btn){
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.speak-btn.speaking').forEach(b => b.classList.remove('speaking'));

  const cleanText = stripEmojis(text);
  const sentences = splitIntoSentences(cleanText);
  if (!sentences.length) return;

  if (btn) btn.classList.add('speaking');

  sentences.forEach((sentence, i) => {
    const utter = new SpeechSynthesisUtterance(sentence);
    if (spanishVoice) utter.voice = spanishVoice;
    utter.lang = spanishVoice ? spanishVoice.lang : 'es-ES';

    const vp = getVoiceParams(sentence);
    utter.rate = vp.rate;
    utter.pitch = vp.pitch;

    if (btn && i === sentences.length - 1){
      utter.onend = () => btn.classList.remove('speaking');
      utter.onerror = () => btn.classList.remove('speaking');
    }

    window.speechSynthesis.speak(utter);
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderMessageBody(text){
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const escaped = escapeHtml(text);
  return escaped.replace(urlRegex, (url) => {
    const cleanUrl = url.replace(/[).,;:!?]+$/, '');
    const trailing = url.slice(cleanUrl.length);
    const isBooking = cleanUrl.includes('innerstandingcoaching.netlify.app');
    const label = isBooking ? 'Agendar sesión 1:1 →' : cleanUrl.replace(/^https?:\/\//, '');
    return `<a href="${cleanUrl}" target="_blank" rel="noopener noreferrer" class="chat-link${isBooking ? ' chat-link-cta' : ''}">${label}</a>${trailing}`;
  });
}

function addMessage(role, text, forceSpeak, videoCard){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  const label = document.createElement('span');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'Tú' : 'Innerstanding';
  wrap.appendChild(label);
  const body = document.createElement('div');
  if (role === 'ai'){
    body.innerHTML = renderMessageBody(text);
  } else {
    body.textContent = text;
  }
  wrap.appendChild(body);

  if (role === 'ai' && videoCard){
    const videoBtn = document.createElement('button');
    videoBtn.className = 'video-mode-btn';
    videoBtn.innerHTML = '🎥 Ver como video';
    videoBtn.addEventListener('click', () => openVideoMode(videoCard, text));
    wrap.appendChild(videoBtn);
  } else if (role === 'ai' && 'speechSynthesis' in window){
    const btn = document.createElement('button');
    btn.className = 'speak-btn';
    btn.setAttribute('aria-label', 'Escuchar');
    btn.textContent = '🔊';
    btn.addEventListener('click', () => speak(text, btn));
    wrap.appendChild(btn);

    if (forceSpeak || (autoVoiceToggle && autoVoiceToggle.checked)){
      speak(text, btn);
    }
  }

  if (role === 'ai'){
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.setAttribute('aria-label', 'Copiar texto');
    copyBtn.textContent = '📋';
    copyBtn.addEventListener('click', async () => {
      try{
        await navigator.clipboard.writeText(text);
        copyBtn.classList.add('copied');
        copyBtn.textContent = '✓';
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.textContent = '📋';
        }, 1500);
      }catch(e){ console.error('No se pudo copiar', e); }
    });
    wrap.appendChild(copyBtn);
  }

  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function addCardDraw(){
  const wrap = document.createElement('div');
  wrap.className = 'card-draw';
  wrap.innerHTML = `
    <div class="tarot-card" id="tarotCard-${cardsDrawnCount}"></div>
    <button class="draw-btn" id="drawBtn-${cardsDrawnCount}">Sacar una carta</button>
  `;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;

  const drawBtnId = 'drawBtn-' + cardsDrawnCount;
  const tarotCardId = 'tarotCard-' + cardsDrawnCount;

  document.getElementById(drawBtnId).addEventListener('click', () => {
    const card = CARDS[Math.floor(Math.random() * CARDS.length)];
    const el = document.getElementById(tarotCardId);
    el.classList.add('revealed');
    el.innerHTML = `<img src="/cards/${card.file}" alt="${card.name}">`;
    document.getElementById(drawBtnId).remove();

    const label = document.createElement('div');
    label.className = 'card-name';
    label.textContent = card.name;
    wrap.appendChild(label);

    cardsDrawnCount++;
    updateCardButton();

    setTimeout(() => {
      sendUserTurn(`Saqué la carta: ${card.name}.`, `Saqué: ${card.name}`);
    }, 500);
  });
}

function updateCardButton(){
  const remaining = MAX_CARDS - cardsDrawnCount;
  if (remaining <= 0){
    cardBtn.disabled = true;
    cardBtn.setAttribute('aria-label', 'Ya usaste tus 3 cartas');
    cardsCounter.textContent = 'Ya usaste tus 3 cartas para esta sesión. Puedes seguir conversando con lo que ya salió.';
    cardsCounter.classList.add('limit-note');
  } else {
    cardBtn.disabled = false;
    cardsCounter.textContent = 'Innerstanding es un espacio de introspección, no un sustituto de terapia o coaching profesional.';
    cardsCounter.classList.remove('limit-note');
  }
}

function showTyping(){
  const el = document.createElement('div');
  el.className = 'typing';
  el.id = 'typingIndicator';
  el.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function requestClaudeOnce(){
  const response = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages: history })
  });

  let data;
  try{
    data = await response.json();
  }catch(e){
    throw new Error("Respuesta no válida del servidor.");
  }

  if (!response.ok || data.error){
    const msg = (data && data.error && (data.error.message || data.error.type)) || ("HTTP " + response.status);
    throw new Error(msg);
  }

  const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
  const reply = textBlocks.join('\n').trim();
  if (!reply) throw new Error("Respuesta vacía.");
  return reply;
}

async function requestClaudeWithRetry(maxAttempts){
  let lastErr;
  for (let attempt = 1; attempt <= maxAttempts; attempt++){
    try{
      return await requestClaudeOnce();
    }catch(err){
      lastErr = err;
      console.error("Intento " + attempt + " falló:", err);
      if (attempt < maxAttempts){
        await sleep(700 * attempt);
      }
    }
  }
  throw lastErr;
}

function addRetryPrompt(){
  const wrap = document.createElement('div');
  wrap.className = 'msg ai';
  wrap.innerHTML = `
    <span class="msg-label">Innerstanding</span>
    <div>Se cortó la conexión con el espejo un segundo. No es cosa tuya — a veces el servidor se pone necio.</div>
    <button class="retry-btn" id="retryBtn">Reintentar</button>
  `;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  document.getElementById('retryBtn').addEventListener('click', () => {
    wrap.remove();
    callClaude(null);
  });
}

async function callClaude(userText, forceSpeak, videoCard){
  if (userText !== null){
    history.push({ role: 'user', content: userText });
  }
  showTyping();
  sendBtn.disabled = true;

  try{
    const reply = await requestClaudeWithRetry(3);
    hideTyping();
    history.push({ role: 'assistant', content: reply });
    addMessage('ai', reply, forceSpeak, videoCard);
  }catch(err){
    hideTyping();
    addRetryPrompt();
  }finally{
    sendBtn.disabled = false;
  }
}

function sendUserTurn(fullText, displayText){
  addMessage('user', displayText || fullText);
  callClaude(fullText);
}

function revealRandomCardInline(){
  const card = CARDS[Math.floor(Math.random() * CARDS.length)];
  const wrap = document.createElement('div');
  wrap.className = 'card-draw';
  wrap.innerHTML = `
    <div class="tarot-card revealed"><img src="/cards/${card.file}" alt="${card.name}"></div>
    <div class="card-name">${card.name}</div>
  `;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return card;
}

function runContentMode(){
  const card = revealRandomCardInline();
  const prompt = `Modo contenido: saqué "${card.name}" para publicar hoy como carta del día. Dame directo la versión corta para contenido — 2-3 frases con gancho real, lista para copiar y pegar en redes, sin preguntarme nada antes ni pedirme contexto.`;
  history.push({ role: 'user', content: prompt });
  callClaude(null, false, card);
}

const ZODIAC_SIGNS = {
  'aries':'Aries','tauro':'Tauro','géminis':'Géminis','geminis':'Géminis',
  'cáncer':'Cáncer','cancer':'Cáncer','leo':'Leo','virgo':'Virgo','libra':'Libra',
  'escorpio':'Escorpio','sagitario':'Sagitario','capricornio':'Capricornio',
  'acuario':'Acuario','piscis':'Piscis'
};

function detectZodiacSign(text){
  const lower = text.toLowerCase();
  for (const key in ZODIAC_SIGNS){
    const regex = new RegExp('\\b' + key + '\\b', 'i');
    if (regex.test(lower)) return ZODIAC_SIGNS[key];
  }
  return null;
}

function runZodiacMode(sign, userText){
  addMessage('user', userText);
  const card = revealRandomCardInline();
  const prompt = `Modo contenido / horóscopo hablado: me preguntaron por el signo ${sign}. Saqué la carta: ${card.name}. Empieza reconociendo el signo y diciendo, en tus propias palabras, algo como "veamos qué carta le sale a ${sign} hoy" — y de inmediato interpreta esa carta conectada con la energía típica de ${sign} en este momento. Tono hablado, cálido, con gancho, 3-5 frases, listo para grabar en audio.`;
  history.push({ role: 'user', content: prompt });
  callClaude(null, false, card);
}

function handleSend(){
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';

  const sign = detectZodiacSign(text);
  if (sign){
    runZodiacMode(sign, text);
  } else {
    sendUserTurn(text);
  }
}

function init(){
  try{
    chat = document.getElementById('chat');
    input = document.getElementById('input');
    sendBtn = document.getElementById('sendBtn');
    autoVoiceToggle = document.getElementById('autoVoice');
    cardBtn = document.getElementById('cardBtn');
    cardsCounter = document.getElementById('cardsCounter');
    contentModeBtn = document.getElementById('contentModeBtn');
    chat.innerHTML = '';

    sendBtn.addEventListener('click', handleSend);
    cardBtn.addEventListener('click', () => {
      if (cardsDrawnCount >= MAX_CARDS) return;
      addCardDraw();
    });
    contentModeBtn.addEventListener('click', runContentMode);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        handleSend();
      }
    });
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    addMessage('ai', "Bienvenida a tu espacio. Antes de sacar la carta, hazte una pregunta o pon una intención en tu mente — puede ser sobre lo que sea que estés atravesando ahorita. Si quieres, cuéntamela para profundizar juntas. Si no, solo saca la carta cuando estés lista.");
    addCardDraw();
  }catch(err){
    document.body.innerHTML = '<div style="padding:40px 24px; color:#ece5d8; font-family:sans-serif; text-align:center;">Algo no cargó bien. Intenta abrir este archivo en Chrome o Safari en vez del visor de archivos.<br><br><span style="opacity:0.5; font-size:0.75rem;">' + (err && err.message ? err.message : '') + '</span></div>';
    console.error(err);
  }
}

if (document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
}else{
  init();
}
